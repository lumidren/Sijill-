name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests (SQLite)
        working-directory: backend
        run: python -m pytest

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdpl
          POSTGRES_PASSWORD: pdpl
          POSTGRES_DB: pdpl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdpl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PDPL_TEST_DATABASE_URL: postgresql+psycopg://pdpl:pdpl@localhost:5432/pdpl_test
      DATABASE_URL: postgresql+psycopg://pdpl:pdpl@localhost:5432/pdpl_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt "psycopg[binary]"
      - name: Tests (Postgres)
        working-directory: backend
        run: python -m pytest

  prowler-mapping:
    # Installs the real Prowler on Linux and checks every mapped check ID against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Install Prowler in its own virtualenv (it pins pydantic and regex differently from Sijill)
        run: python -m venv .vp && .vp/bin/pip install prowler==5.50.0
      - name: Mapping uses only check IDs that exist in the installed Prowler
        working-directory: backend
        env:
          PDPL_REQUIRE_PROWLER: "1"
        run: python -m pytest tests/test_mapping.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  docker:
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build image (not pushed)
        run: docker build -t sijill:ci .
