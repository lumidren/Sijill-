<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Sijill</title>
  <desc id="d">Sijill: open-source readiness platform for Egypt's Personal Data Protection Law, Law 151 of 2020.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3a"/>
      <stop offset="0.6" stop-color="#114e4a"/>
      <stop offset="1" stop-color="#0d7b72"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad4c3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ad4c3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .ar { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- mark -->
  <g transform="translate(88 92)">
    <rect width="120" height="120" rx="30" fill="#0f3d3a" stroke="#5ad4c3" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M60 22l30 11v23c0 19-12.7 34-30 41-17.3-7-30-22-30-41V33z" fill="url(#glow)" stroke="#5eead4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M46 60l9.5 9.5 18-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- words -->
  <text x="240" y="150" class="sans" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">Sijill</text>
  <text x="436" y="150" class="ar" font-size="60" font-weight="600" fill="#94e9da">سجل</text>
  <text x="242" y="196" class="sans" font-size="26" fill="#c9f5ec">Readiness for Egypt's Personal Data Protection Law (151/2020)</text>
  <text x="242" y="232" class="sans" font-size="19" fill="#ffffff" fill-opacity="0.72">Open source · self-hosted · English and Arabic · built for consultants and DPOs</text>

  <!-- chips -->
  <g class="sans" font-size="16" font-weight="600">
    <g transform="translate(88 286)">
      <rect width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#5ad4c3" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#38bdf8"/>
      <text x="36" y="26" fill="#ffffff">Automated evidence</text>
    </g>
    <g transform="translate(298 286)">
      <rect width="172" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#5ad4c3" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#a78bfa"/>
      <text x="36" y="26" fill="#ffffff">Several clients</text>
    </g>
    <g transform="translate(484 286)">
      <rect width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#5ad4c3" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#fbbf24"/>
      <text x="36" y="26" fill="#ffffff">Evidence requests</text>
    </g>
    <g transform="translate(688 286)">
      <rect width="156" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#5ad4c3" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#f87171"/>
      <text x="36" y="26" fill="#ffffff">Breach clocks</text>
    </g>
    <g transform="translate(858 286)">
      <rect width="148" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#5ad4c3" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#34d399"/>
      <text x="36" y="26" fill="#ffffff">OSCAL 1.1.3</text>
    </g>
  </g>

  <!-- score dial, right -->
  <g transform="translate(1100 140)" class="sans">
    <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="16"/>
    <circle r="78" fill="none" stroke="#38bdf8" stroke-width="16" stroke-dasharray="150 490" transform="rotate(-90)" stroke-linecap="round"/>
    <circle r="78" fill="none" stroke="#a78bfa" stroke-width="16" stroke-dasharray="190 490" stroke-dashoffset="-160" transform="rotate(-90)" stroke-linecap="round"/>
    <text y="10" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">44</text>
    <text y="36" text-anchor="middle" font-size="13" fill="#c9f5ec">readiness</text>
    <text y="122" text-anchor="middle" font-size="13" fill="#ffffff" fill-opacity="0.7">not legal compliance</text>
  </g>
</svg>
