# Written as a deliverable; not run on the development machine.
# SQLite by default. To use Postgres instead, uncomment the db service and DATABASE_URL
# (and add psycopg[binary] to backend/requirements.txt).
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PDPL_SEED_DEMO: "1"
      PDPL_COOKIE_SECURE: "false" # set to true behind HTTPS
      # AWS evidence collection: reference a profile or role; never put access keys here.
      # PDPL_AWS_PROFILE: "audit-readonly"
      # DATABASE_URL: postgresql+psycopg://pdpl:change-me@db:5432/pdpl
    volumes:
      - pdpl-data:/data
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: pdpl
  #     POSTGRES_PASSWORD: change-me
  #     POSTGRES_DB: pdpl
  #   volumes:
  #     - pdpl-pg:/var/lib/postgresql/data

volumes:
  pdpl-data:
  # pdpl-pg:
